<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Quizlet flashcard scraper: a user's public folders and flashcard sets rendered in Chrome, exported to one text file per set</title>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}.d{fill:#d4d4d8}
    .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    .v{fill:#a78bfa}.bl{fill:#60a5fa}.g{fill:#4ade80}.a{fill:#fbbf24}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">Quizlet Scraper — public folders → flashcard files</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Playwright · real Chrome · Zod</text>

  <!-- Source 1: folders page -->
  <rect x="24" y="64" width="420" height="176" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="86" font-size="12" class="w b">Folders page</text>
  <text x="424" y="86" font-size="10" class="m mono" text-anchor="end">quizlet.com/user/biostudent/folders</text>
  <path d="M24 98h420" stroke="#27272a"/>
  <text x="44" y="124" font-size="14" class="w b">biostudent’s folders</text>
  <path d="M44 162h240M44 188h240" stroke="#1f1f23"/>
  <g fill="#3f3f46">
    <rect x="50" y="143" width="14" height="10" rx="2"/><rect x="50" y="169" width="14" height="10" rx="2"/><rect x="50" y="195" width="14" height="10" rx="2"/>
  </g>
  <g font-size="11" class="p">
    <text x="74" y="153">Biology 101</text><text x="74" y="179">Spanish Vocab</text><text x="74" y="205">AP US History</text>
  </g>
  <g font-size="11" class="m" text-anchor="end">
    <text x="284" y="153">4 sets</text><text x="284" y="179">5 sets</text><text x="284" y="205">6 sets</text>
  </g>
  <g fill-opacity=".14" stroke-width="1.3" fill="#a78bfa" stroke="#8b5cf6">
    <rect x="69" y="141" width="72" height="17" rx="3"/>
    <rect x="69" y="167" width="86" height="17" rx="3"/>
    <rect x="69" y="193" width="86" height="17" rx="3"/>
  </g>
  <rect x="316" y="140" width="108" height="66" rx="8" fill="#12251a" stroke="#22c55e"/>
  <path d="M332 158l3 3 6-6" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="348" y="162" font-size="11" class="g b">Verified</text>
  <text x="328" y="182" font-size="10" class="s">Cloudflare check</text>
  <text x="328" y="196" font-size="10" class="s">cookies kept</text>
  <text x="44" y="228" font-size="10" class="m">Only public folders and sets are exported</text>

  <circle cx="456" cy="152" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 147l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Source 2: flashcard set -->
  <rect x="24" y="252" width="420" height="176" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="274" font-size="12" class="w b">Flashcard set</text>
  <text x="424" y="274" font-size="10" class="m mono" text-anchor="end">quizlet.com/…/cell-structure-flash-cards</text>
  <path d="M24 286h420" stroke="#27272a"/>
  <text x="44" y="312" font-size="14" class="w b">Cell Structure</text>
  <text x="424" y="312" font-size="11" class="m" text-anchor="end">Terms in this set (24)</text>
  <g fill="#18181b" stroke="#27272a">
    <rect x="44" y="324" width="380" height="28" rx="6"/>
    <rect x="44" y="358" width="380" height="28" rx="6"/>
    <rect x="44" y="392" width="380" height="28" rx="6"/>
  </g>
  <path d="M160 330v16M160 364v16M160 398v16" stroke="#3f3f46"/>
  <g font-size="11" class="p">
    <text x="56" y="342">Mitochondria</text><text x="56" y="376">Ribosome</text><text x="56" y="410">Nucleus</text>
  </g>
  <g font-size="11" class="d">
    <text x="172" y="342">Produces ATP via cellular respiration</text>
    <text x="172" y="376">Site of protein synthesis</text>
    <text x="172" y="410">Holds the cell’s DNA</text>
  </g>
  <g fill-opacity=".14" stroke-width="1.3">
    <rect x="51" y="330" width="78" height="17" rx="3" fill="#a78bfa" stroke="#8b5cf6"/>
    <rect x="51" y="364" width="56" height="17" rx="3" fill="#a78bfa" stroke="#8b5cf6"/>
    <rect x="51" y="398" width="50" height="17" rx="3" fill="#a78bfa" stroke="#8b5cf6"/>
    <rect x="167" y="330" width="208" height="17" rx="3" fill="#60a5fa" stroke="#3b82f6"/>
    <rect x="167" y="364" width="144" height="17" rx="3" fill="#60a5fa" stroke="#3b82f6"/>
    <rect x="167" y="398" width="116" height="17" rx="3" fill="#60a5fa" stroke="#3b82f6"/>
  </g>

  <circle cx="456" cy="340" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 335l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Source 3: run log -->
  <rect x="24" y="440" width="420" height="176" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="462" font-size="12" class="w b">Run log</text>
  <text x="424" y="462" font-size="10" class="m mono" text-anchor="end">npm run dev</text>
  <path d="M24 474h420" stroke="#27272a"/>
  <g font-size="11" class="mono">
    <text x="44" y="496" class="s">$ npm run dev -- quizlet.com/user/biostudent/folders</text>
    <text x="44" y="514" class="d"><tspan class="g">✓</tspan> Cloudflare verified · profile .quizlet-chrome</text>
    <text x="44" y="532" class="w">▸ Biology 101 <tspan class="m">(4 sets)</tspan></text>
    <text x="58" y="550" class="d"><tspan class="g">✓</tspan> Cell Structure ........ <tspan class="v">24 cards</tspan></text>
    <text x="58" y="568" class="d"><tspan class="g">✓</tspan> Photosynthesis ........ <tspan class="v">18 cards</tspan></text>
    <text x="58" y="586" class="d"><tspan class="a">✗</tspan> Genetics <tspan class="a">timed out, skipped · continuing</tspan></text>
    <text x="44" y="604" class="w">▸ Spanish Vocab <tspan class="m">(5 sets)</tspan></text>
  </g>

  <circle cx="456" cy="528" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 523l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Output tree -->
  <rect x="468" y="64" width="468" height="236" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="94" font-size="15" class="w b">Exported</text>
  <text x="916" y="94" font-size="11" class="m mono" text-anchor="end">data/&lt;folder&gt;/&lt;set&gt;.txt</text>
  <path d="M468 110h468" stroke="#27272a"/>
  <g font-size="12" class="mono">
    <text x="488" y="136" class="s">data/</text>
    <text x="488" y="158" class="m">├─ <tspan class="w b">Biology 101/</tspan></text>
    <text x="488" y="178" class="m">│  ├─ <tspan class="d">Cell Structure.txt</tspan></text>
    <text x="488" y="198" class="m">│  ├─ <tspan class="d">Photosynthesis.txt</tspan></text>
    <text x="488" y="218" class="m">│  └─ <tspan class="d">Cell Division.txt</tspan></text>
    <text x="488" y="240" class="m">├─ <tspan class="w b">Spanish Vocab/</tspan></text>
    <text x="488" y="262" class="m">└─ <tspan class="w b">AP US History/</tspan></text>
  </g>
  <g font-size="12" class="mono" text-anchor="end">
    <text x="912" y="178" class="v">24 cards</text>
    <text x="912" y="198" class="v">18 cards</text>
    <text x="912" y="218" class="v">21 cards</text>
    <text x="912" y="240" class="m">5 sets</text>
    <text x="912" y="262" class="m">6 sets</text>
  </g>
  <text x="488" y="286" font-size="11" class="m">3 folders · 14 sets exported · 1 skipped</text>

  <!-- File contents -->
  <rect x="468" y="316" width="468" height="180" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="342" font-size="12" class="w b">Cell Structure.txt</text>
  <text x="916" y="342" font-size="10" class="m mono" text-anchor="end">data/Biology 101/</text>
  <g font-size="12" class="mono s">
    <text x="488" y="370">1. <tspan class="v">Mitochondria</tspan> : <tspan class="bl">Produces ATP via cellular respiration</tspan></text>
    <text x="488" y="388">2. <tspan class="v">Ribosome</tspan> : <tspan class="bl">Site of protein synthesis</tspan></text>
    <text x="488" y="406">3. <tspan class="v">Nucleus</tspan> : <tspan class="bl">Holds the cell’s DNA</tspan></text>
    <text x="488" y="424">4. <tspan class="v">Cell membrane</tspan> : <tspan class="bl">Controls what enters and leaves</tspan></text>
    <text x="488" y="442">5. <tspan class="v">Golgi apparatus</tspan> : <tspan class="bl">Packages and ships proteins</tspan></text>
    <text x="488" y="460" class="m">…</text>
    <text x="488" y="478">24. <tspan class="v">Cytoplasm</tspan> : <tspan class="bl">Gel that fills the cell</tspan></text>
  </g>

  <!-- Validation -->
  <rect x="468" y="512" width="468" height="104" rx="12" fill="#111113" stroke="#27272a"/>
  <g fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="490" cy="536" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 536l2 2 4-4"/>
    <circle cx="490" cy="562" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 562l2 2 4-4"/>
    <circle cx="490" cy="588" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 588l2 2 4-4"/>
  </g>
  <g font-size="12" class="p">
    <text x="506" y="540">Every set validated with Zod before it’s written to disk</text>
    <text x="506" y="566">One failed set is logged and skipped, the run keeps going</text>
    <text x="506" y="592">Real Chrome + saved profile, so Cloudflare is passed once</text>
  </g>
</svg>
