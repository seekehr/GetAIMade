<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>ShiaBox hadith extractor: volumes discovered on thaqalayn.net, chapter HTML parsed into structured JSON records with Arabic, English and source links</title>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}.d{fill:#d4d4d8}
    .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    .ar{font-family:'Segoe UI', 'Noto Naskh Arabic', 'Geeza Pro', Tahoma, sans-serif}
    .v{fill:#a78bfa}.bl{fill:#60a5fa}.g{fill:#4ade80}.a{fill:#fbbf24}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">ShiaBox Extractor — hadith pages → structured records</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Playwright · HTTP · node-html-parser</text>

  <!-- Step 1: discover -->
  <rect x="24" y="64" width="420" height="176" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="86" font-size="12" class="w b">Discover volumes</text>
  <text x="424" y="86" font-size="10" class="m mono" text-anchor="end">thaqalayn.net · Playwright</text>
  <path d="M24 98h420" stroke="#27272a"/>
  <text x="44" y="124" font-size="14" class="w b">Al-Kāfi</text>
  <g fill="#18181b" stroke="#27272a">
    <rect x="44" y="140" width="44" height="26" rx="6"/><rect x="92" y="140" width="44" height="26" rx="6"/>
    <rect x="140" y="140" width="44" height="26" rx="6"/><rect x="188" y="140" width="44" height="26" rx="6"/>
    <rect x="236" y="140" width="44" height="26" rx="6"/><rect x="284" y="140" width="44" height="26" rx="6"/>
    <rect x="332" y="140" width="44" height="26" rx="6"/><rect x="380" y="140" width="44" height="26" rx="6"/>
  </g>
  <rect x="44" y="140" width="44" height="26" rx="6" fill="#a78bfa" fill-opacity=".14" stroke="#8b5cf6" stroke-width="1.3"/>
  <g font-size="11" class="d" text-anchor="middle">
    <text x="66" y="157" class="v b">Vol 1</text><text x="114" y="157">Vol 2</text><text x="162" y="157">Vol 3</text><text x="210" y="157">Vol 4</text>
    <text x="258" y="157">Vol 5</text><text x="306" y="157">Vol 6</text><text x="354" y="157">Vol 7</text><text x="402" y="157">Vol 8</text>
  </g>
  <g font-size="11" class="mono">
    <text x="44" y="196" class="d"><tspan class="g">✓</tspan> books and volumes discovered in the browser</text>
    <text x="44" y="216" class="d"><tspan class="g">✓</tspan> chapter URLs queued for plain HTTP fetches</text>
  </g>

  <circle cx="456" cy="152" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 147l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: chapter HTML -->
  <rect x="24" y="252" width="420" height="176" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="274" font-size="12" class="w b">Chapter page</text>
  <text x="424" y="274" font-size="10" class="m mono" text-anchor="end">fetched over HTTP</text>
  <path d="M24 286h420" stroke="#27272a"/>
  <text x="44" y="312" font-size="13" class="w b">Book 1 · Chapter 1</text>
  <rect x="44" y="324" width="380" height="92" rx="8" fill="#18181b" stroke="#27272a"/>
  <rect x="54" y="332" width="30" height="18" rx="4" fill="#a78bfa" fill-opacity=".14" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="69" y="345" font-size="11" class="v b" text-anchor="middle">1</text>
  <text x="412" y="348" font-size="16" class="ar g" direction="rtl" text-anchor="start">لَمَّا خَلَقَ اللَّهُ الْعَقْلَ اسْتَنْطَقَهُ</text>
  <rect x="52" y="364" width="302" height="19" rx="3" fill="#60a5fa" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="56" y="378" font-size="12" class="d">When Allah created the intellect, He made it speak…</text>
  <text x="56" y="402" font-size="10" class="a mono">thaqalayn.net/hadith/1/1/1/1</text>

  <circle cx="456" cy="340" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 335l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: run log -->
  <rect x="24" y="440" width="420" height="176" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="462" font-size="12" class="w b">Run log</text>
  <text x="424" y="462" font-size="10" class="m mono" text-anchor="end">scraper/</text>
  <path d="M24 474h420" stroke="#27272a"/>
  <g font-size="11" class="mono">
    <text x="44" y="498" class="w">▸ Al-Kāfi · Volume 1</text>
    <text x="58" y="518" class="d"><tspan class="g">✓</tspan> chapter 1 → english, arabic, metadata</text>
    <text x="58" y="538" class="d"><tspan class="g">✓</tspan> chapter 2 → english, arabic, metadata</text>
    <text x="58" y="558" class="m">…</text>
    <text x="44" y="578" class="w">▸ Al-Kāfi · Volume 2</text>
    <text x="44" y="602" class="d"><tspan class="g">✓</tspan> wrote <tspan class="a">output/al-kafi.json</tspan></text>
  </g>

  <circle cx="456" cy="528" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 523l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Record JSON -->
  <rect x="468" y="64" width="468" height="316" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="94" font-size="15" class="w b">Extracted record</text>
  <text x="916" y="94" font-size="11" class="m mono" text-anchor="end">output/al-kafi.json</text>
  <path d="M468 110h468" stroke="#27272a"/>
  <g font-size="12" class="mono s">
    <text x="488" y="138">{</text>
    <text x="506" y="156">"book_name": <tspan class="w">"Al-Kāfi"</tspan>,</text>
    <text x="506" y="174">"volume_number": <tspan class="v">1</tspan>,</text>
    <text x="506" y="192">"chapter_number": <tspan class="v">1</tspan>,</text>
    <text x="506" y="210">"hadith_number": <tspan class="v">1</tspan>,</text>
    <text x="506" y="228">"content": <tspan class="bl">"When Allah created the intellect…"</tspan>,</text>
    <text x="506" y="246">"metadata": {</text>
    <text x="524" y="264">"book_number": <tspan class="v">1</tspan>,</text>
    <text x="524" y="282">"chapter_name": <tspan class="w">"…"</tspan>,</text>
    <text id="arkey" x="524" y="300">"arabic": "</text>
    <text x="524" y="318">"url": <tspan class="a">"https://thaqalayn.net/hadith/1/1/1/1"</tspan></text>
    <text x="506" y="336">}</text>
    <text x="488" y="354">}</text>
  </g>
  <text id="arval" x="718" y="301" font-size="14" class="ar g" direction="rtl" text-anchor="start">لَمَّا خَلَقَ اللَّهُ الْعَقْلَ…</text>
  <text id="arend" x="720" y="300" font-size="12" class="mono s">",</text>

  <!-- Into RAG -->
  <rect x="468" y="396" width="468" height="220" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="422" font-size="12" class="w b">Ready for search</text>
  <text x="916" y="422" font-size="10" class="m mono" text-anchor="end">shiabox/server</text>
  <g fill="#18181b" stroke="#27272a">
    <rect x="488" y="436" width="84" height="26" rx="13"/>
    <rect x="596" y="436" width="160" height="26" rx="13"/>
    <rect x="780" y="436" width="136" height="26" rx="13"/>
  </g>
  <g font-size="11" class="p" text-anchor="middle">
    <text x="530" y="453">JSON</text><text x="676" y="453">Ollama embeddings</text><text x="848" y="453">Qdrant index</text>
  </g>
  <g fill="none" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M578 449h12M586 445l4 4-4 4M762 449h12M770 445l4 4-4 4"/>
  </g>
  <g fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="490" cy="494" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 494l2 2 4-4"/>
    <circle cx="490" cy="522" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 522l2 2 4-4"/>
    <circle cx="490" cy="550" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 550l2 2 4-4"/>
    <circle cx="490" cy="578" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M487 578l2 2 4-4"/>
  </g>
  <g font-size="12" class="p">
    <text x="506" y="498">Arabic and English kept side by side on every hadith</text>
    <text x="506" y="526">Book, volume, chapter and hadith numbers on each record</text>
    <text x="506" y="554">Source URL kept, so every answer cites the exact page</text>
    <text x="506" y="582">Browser only for discovery, chapters fetched over fast HTTP</text>
  </g>
</svg>
