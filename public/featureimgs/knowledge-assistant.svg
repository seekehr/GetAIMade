  <text x="324" y="199" font-size="12" class="b" fill="#0b0b0c" text-anchor="middle">AI</text>
  <text x="356" y="198" font-size="14" class="p">Annual plans can be refunded in full within 30 days of purchase <tspan class="c b">[1]</tspan>.</text>
  <text x="356" y="222" font-size="14" class="p">After that, customers get a prorated account credit instead <tspan class="c b">[1]</tspan>.</text>
  <text x="356" y="254" font-size="14" class="p">Exceptions over $500 need sign-off from the Support Lead; anything</text>
  <text x="356" y="278" font-size="14" class="p">over $2,000 goes to the Head of Finance <tspan class="c b">[2]</tspan>.</text>

