<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>FindClients: Upwork feed and X searches feed a scrape run that dedupes, filters and screens leads with Gemini, shown in a leads dashboard with scores and reasons</title>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}.d{fill:#d4d4d8}
    .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    .v{fill:#a78bfa}.bl{fill:#60a5fa}.g{fill:#4ade80}.a{fill:#fbbf24}.r{fill:#f87171}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">FindClients — client leads, found and screened</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Playwright · Gemini · Express · Next.js</text>

  <!-- Sources -->
  <rect x="24" y="64" width="420" height="196" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="86" font-size="12" class="w b">Sources</text>
  <text x="424" y="86" font-size="10" class="m mono" text-anchor="end">every 30 min + jitter</text>
  <path d="M24 98h420" stroke="#27272a"/>
  <rect x="44" y="110" width="380" height="48" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="58" y="130" font-size="12" class="g b">Upwork</text>
  <text x="410" y="130" font-size="10" class="m" text-anchor="end">watched, not bulk-scraped</text>
  <text x="58" y="148" font-size="11" class="s">One feed tab, reloaded every 10–15 min</text>
  <rect x="44" y="166" width="380" height="48" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="58" y="186" font-size="12" class="w b">X / Twitter</text>
  <text x="410" y="186" font-size="10" class="m" text-anchor="end">≤ 15 per keyword</text>
  <text x="58" y="204" font-size="11" class="s">Keyword search · min likes and views · recent posts</text>
  <g fill-opacity=".14" stroke-width="1.2">
    <rect x="44" y="224" width="78" height="22" rx="11" fill="#a78bfa" stroke="#8b5cf6"/>
    <rect x="128" y="224" width="82" height="22" rx="11" fill="#a78bfa" stroke="#8b5cf6"/>
    <rect x="216" y="224" width="66" height="22" rx="11" fill="#a78bfa" stroke="#8b5cf6"/>
    <rect x="288" y="224" width="60" height="22" rx="11" fill="#f87171" stroke="#ef4444"/>
    <rect x="354" y="224" width="70" height="22" rx="11" fill="#fbbf24" stroke="#f59e0b"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="83" y="239" class="v">automation</text>
    <text x="169" y="239" class="v">web scraper</text>
    <text x="249" y="239" class="v">AI agent</text>
    <text x="318" y="239" class="r">− unpaid</text>
    <text x="389" y="239" class="a">min $500</text>
  </g>

  <circle cx="234" cy="266" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M229 264l5 5 5-5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scrape run -->
  <rect x="24" y="272" width="420" height="344" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="294" font-size="12" class="w b">Scrape run</text>
  <text x="424" y="294" font-size="10" class="m mono" text-anchor="end">14:30 · +1m12s jitter</text>
  <path d="M24 306h420" stroke="#27272a"/>
  <g font-size="11" class="mono">
    <text x="44" y="332" class="d">X · <tspan class="v">"automation"</tspan></text><text x="424" y="332" class="p" text-anchor="end">12 found</text>
    <text x="44" y="354" class="d">X · <tspan class="v">"web scraper"</tspan></text><text x="424" y="354" class="p" text-anchor="end">9 found</text>
    <text x="44" y="376" class="d">Upwork feed</text><text x="424" y="376" class="p" text-anchor="end">3 new jobs</text>
    <path d="M44 390h380" stroke="#27272a"/>
    <text x="44" y="412" class="m">− 4 duplicates (sha1 of platform + url)</text>
    <text x="44" y="432" class="m">− 2 dismissed in the last 30 days</text>
    <text x="44" y="452" class="m">− 3 under min budget or excluded keyword</text>
    <text x="44" y="478" class="d"><tspan class="g">✓</tspan> 15 new leads saved to <tspan class="a">leads.json</tspan></text>
    <path d="M44 494h380" stroke="#27272a"/>
    <text x="44" y="518" class="w">▸ Gemini screening · <tspan class="s">gemini-3.8-flash</tspan></text>
    <text x="58" y="540" class="d"><tspan class="g">11 qualified</tspan> · <tspan class="r">4 rejected</tspan></text>
    <text x="44" y="566" class="d"><tspan class="g">✓</tspan> new leads posted to Discord webhook</text>
  </g>
  <text x="44" y="598" font-size="10" class="m mono">leadsPerRun 25 · twitterLimitPerKeyword 15</text>

  <circle cx="456" cy="340" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 335l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dashboard -->
  <rect x="468" y="64" width="468" height="552" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="90" font-size="15" class="w b">Leads</text>
  <text x="916" y="90" font-size="11" class="m mono" text-anchor="end">localhost:4000</text>
  <path d="M468 104h468" stroke="#27272a"/>
  <rect x="488" y="116" width="66" height="26" rx="13" fill="#fafafa"/>
  <g fill="none" stroke="#27272a">
    <rect x="560" y="116" width="100" height="26" rx="13"/>
    <rect x="666" y="116" width="92" height="26" rx="13"/>
    <rect x="764" y="116" width="62" height="26" rx="13"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="521" y="133" class="b" fill="#0b0b0c">New 11</text>
    <text x="610" y="133" class="s">Bookmarked 3</text>
    <text x="712" y="133" class="s">Contacted 5</text>
    <text x="795" y="133" class="s">Won 2</text>
  </g>

  <!-- Lead A -->
  <rect x="488" y="156" width="428" height="176" rx="10" fill="#18181b" stroke="#22c55e" stroke-opacity=".5"/>
  <rect x="502" y="168" width="58" height="18" rx="9" fill="#4ade80" fill-opacity=".12"/>
  <text x="531" y="181" font-size="10" class="g b" text-anchor="middle">Upwork</text>
  <text x="902" y="181" font-size="10" class="m" text-anchor="end">18 min ago</text>
  <text x="502" y="208" font-size="13" class="w b">Scrape 40 real-estate sites into a Google Sheet</text>
  <text x="502" y="228" font-size="11" class="s"><tspan class="a">$1,200 fixed</tspan> · client hire rate 78% · payment verified</text>
  <path d="M502 242h400" stroke="#27272a"/>
  <rect x="502" y="252" width="118" height="22" rx="11" fill="#12251a" stroke="#22c55e"/>
  <text x="561" y="267" font-size="11" class="g b" text-anchor="middle">✓ Qualified · 92</text>
  <text x="902" y="267" font-size="10" class="m mono" text-anchor="end">gemini-3.8-flash</text>
  <text x="502" y="292" font-size="12" class="d">Clear scope, verified payment, budget above your minimum.</text>
  <rect x="502" y="302" width="108" height="22" rx="11" fill="#fafafa"/>
  <text x="556" y="317" font-size="11" class="b" fill="#0b0b0c" text-anchor="middle">Mark contacted</text>
  <rect x="616" y="302" width="76" height="22" rx="11" fill="none" stroke="#3f3f46"/>
  <text x="654" y="317" font-size="11" class="p" text-anchor="middle">Bookmark</text>
  <rect x="698" y="302" width="64" height="22" rx="11" fill="none" stroke="#3f3f46"/>
  <text x="730" y="317" font-size="11" class="s" text-anchor="middle">Dismiss</text>

  <!-- Lead B -->
  <rect x="488" y="344" width="428" height="116" rx="10" fill="#18181b" stroke="#27272a"/>
  <rect x="502" y="354" width="30" height="18" rx="9" fill="#fafafa" fill-opacity=".1"/>
  <text x="517" y="367" font-size="10" class="w b" text-anchor="middle">X</text>
  <text x="540" y="367" font-size="11" class="s">@saas_founder</text>
  <text x="902" y="367" font-size="10" class="m" text-anchor="end">1 h ago</text>
  <text x="502" y="394" font-size="12" class="p">“Hiring someone to automate our weekly competitor report.”</text>
  <text x="502" y="414" font-size="11" class="s">2.4k views · 38 likes · matched <tspan class="v">automation</tspan></text>
  <rect x="502" y="426" width="118" height="22" rx="11" fill="#12251a" stroke="#22c55e"/>
  <text x="561" y="441" font-size="11" class="g b" text-anchor="middle">✓ Qualified · 81</text>
  <text x="632" y="441" font-size="12" class="d">Direct hiring intent and a clear task.</text>

  <!-- Lead C -->
  <g opacity=".6">
    <rect x="488" y="472" width="428" height="116" rx="10" fill="#18181b" stroke="#27272a"/>
    <rect x="502" y="482" width="30" height="18" rx="9" fill="#fafafa" fill-opacity=".1"/>
    <text x="517" y="495" font-size="10" class="w b" text-anchor="middle">X</text>
    <text x="540" y="495" font-size="11" class="s">@deal_hunter</text>
    <text x="902" y="495" font-size="10" class="m" text-anchor="end">2 h ago</text>
    <text x="502" y="522" font-size="12" class="p">“Any free tool that tracks Amazon prices?”</text>
    <text x="502" y="542" font-size="11" class="s">310 views · 4 likes · matched <tspan class="v">web scraper</tspan></text>
    <rect x="502" y="554" width="118" height="22" rx="11" fill="#2a1215" stroke="#ef4444"/>
    <text x="561" y="569" font-size="11" class="r b" text-anchor="middle">✗ Rejected · 18</text>
    <text x="632" y="569" font-size="12" class="d">Looking for a free tool, not hiring.</text>
  </g>
</svg>
