<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Data pipeline and API: architecture from scheduler to crawlers, queue, AI processing, deduplication and Postgres, with job runs and an API response</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1f1f23"/></pattern>
  </defs>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}.d{fill:#d4d4d8}
    .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    .cap{font-size:10px;letter-spacing:.08em;font-weight:700;fill:#71717a}
    .node{fill:#141416;stroke:#3f3f46}
    .edge{fill:none;stroke:#71717a;stroke-width:1.5}
    .g{fill:#4ade80}.a{fill:#fbbf24}.bl{fill:#60a5fa}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">Data Pipeline — crawl → AI → database → API</text>
  <circle cx="746" cy="23" r="4" fill="#4ade80"/>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">All systems normal · 12 jobs today</text>

  <!-- Architecture -->
  <rect x="24" y="64" width="912" height="284" rx="12" fill="#0f0f11" stroke="#27272a"/>
  <rect x="25" y="65" width="910" height="282" rx="11" fill="url(#dots)"/>
  <text x="44" y="86" class="cap">ARCHITECTURE</text>

  <circle r="3.5" fill="#4ade80"><animateMotion dur="4s" repeatCount="indefinite" path="M105 130H855"/></circle>
  <circle r="3.5" fill="#4ade80"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M105 130H855"/></circle>

  <path class="edge" d="M165 130H193" marker-end="url(#arr)"/>
  <path class="edge" d="M315 130H343" marker-end="url(#arr)"/>
  <path class="edge" d="M465 130H493" marker-end="url(#arr)"/>
  <path class="edge" d="M615 130H643" marker-end="url(#arr)"/>
  <path class="edge" d="M765 130H793" marker-end="url(#arr)"/>
  <path class="edge" d="M855 164V200H555V234" marker-end="url(#arr)"/>
  <path class="edge" d="M705 200V234" marker-end="url(#arr)"/>
  <path class="edge" d="M855 200V234" marker-end="url(#arr)"/>

  <g text-anchor="middle">
    <rect x="45" y="96" width="120" height="68" rx="10" class="node"/>
    <text x="105" y="125" font-size="13" class="w b">Scheduler</text><text x="105" y="144" font-size="10" class="m">cron · every 6h</text>
    <rect x="195" y="96" width="120" height="68" rx="10" class="node"/>
    <text x="255" y="125" font-size="13" class="w b">Crawlers</text><text x="255" y="144" font-size="10" class="m">4 workers</text>
    <rect x="345" y="96" width="120" height="68" rx="10" class="node"/>
    <text x="405" y="125" font-size="13" class="w b">Job queue</text><text x="405" y="144" font-size="10" class="m">Redis · retries</text>
    <rect x="495" y="96" width="120" height="68" rx="10" fill="#18181b" stroke="#a78bfa"/>
    <text x="555" y="125" font-size="13" class="w b">AI processing</text><text x="555" y="144" font-size="10" fill="#a78bfa">extract · classify</text>
    <rect x="645" y="96" width="120" height="68" rx="10" class="node"/>
    <text x="705" y="125" font-size="13" class="w b">Dedupe</text><text x="705" y="144" font-size="10" class="m">hash + fuzzy match</text>
    <rect x="795" y="96" width="120" height="68" rx="10" class="node"/>
    <text x="855" y="125" font-size="13" class="w b">Postgres</text><text x="855" y="144" font-size="10" class="m">3.2M records</text>

    <rect x="495" y="236" width="120" height="56" rx="10" class="node"/>
    <text x="555" y="260" font-size="13" class="w b">REST API</text><text x="555" y="278" font-size="10" class="m mono">/v1/listings</text>
    <rect x="645" y="236" width="120" height="56" rx="10" class="node"/>
    <text x="705" y="260" font-size="13" class="w b">Exports</text><text x="705" y="278" font-size="10" class="m">CSV · Sheets</text>
    <rect x="795" y="236" width="120" height="56" rx="10" class="node"/>
    <text x="855" y="260" font-size="13" class="w b">Webhooks</text><text x="855" y="278" font-size="10" class="m">on new data</text>
  </g>

  <rect x="45" y="196" width="200" height="60" rx="8" fill="#141416" stroke="#27272a"/>
  <text x="57" y="216" class="cap">PAGES CRAWLED · 24H</text>
  <text x="57" y="243" font-size="19" class="w b">18,420</text>
  <rect x="261" y="196" width="200" height="60" rx="8" fill="#141416" stroke="#27272a"/>
  <text x="273" y="216" class="cap">RECORDS ADDED</text>
  <text x="273" y="243" font-size="19" class="w b">2,317</text>
  <rect x="45" y="268" width="200" height="60" rx="8" fill="#141416" stroke="#27272a"/>
  <text x="57" y="288" class="cap">DUPLICATES DROPPED</text>
  <text x="57" y="315" font-size="19" class="w b">412</text>
  <rect x="261" y="268" width="200" height="60" rx="8" fill="#141416" stroke="#27272a"/>
  <text x="273" y="288" class="cap">FAILED JOBS</text>
  <text x="273" y="315" font-size="19" class="b g">0</text>
  <text x="292" y="315" font-size="11" class="m">(23 retried automatically)</text>

  <!-- Job runs -->
  <rect x="24" y="364" width="448" height="252" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="392" font-size="14" class="w b">Job runs</text>
  <text x="452" y="392" font-size="11" class="m" text-anchor="end">today</text>
  <rect x="40" y="404" width="416" height="22" fill="#18181b"/>
  <g font-size="11" class="s b">
    <text x="48" y="419">Job</text><text x="204" y="419">Status</text><text x="308" y="419">Duration</text><text x="448" y="419" text-anchor="end">Output</text>
  </g>
  <path d="M40 456h416M40 486h416M40 516h416M40 546h416M40 576h416" stroke="#1f1f23"/>
  <g font-size="11" class="mono p">
    <text x="48" y="445">dentists-us</text><text x="48" y="475">plumbers-us</text><text x="48" y="505">competitor-pricing</text>
    <text x="48" y="535">company-enrich</text><text x="48" y="565">docs-recrawl</text><text x="48" y="595">vets-uk</text>
  </g>
  <circle cx="208" cy="441" r="3.5" class="g"/><circle cx="208" cy="471" r="3.5" class="g"/><circle cx="208" cy="501" r="3.5" class="g"/>
  <circle cx="208" cy="531" r="3.5" class="a"/><circle cx="208" cy="561" r="3.5" class="g"/><circle cx="208" cy="591" r="3.5" fill="#71717a"/>
  <g font-size="12">
    <text x="218" y="445" class="g">Success</text><text x="218" y="475" class="g">Success</text><text x="218" y="505" class="g">Success</text>
    <text x="218" y="535" class="a">Retry 1/3</text><text x="218" y="565" class="g">Success</text><text x="218" y="595" class="m">Next 18:00</text>
  </g>
  <g font-size="12" class="d">
    <text x="308" y="445">4m 12s</text><text x="308" y="475">3m 48s</text><text x="308" y="505">0m 52s</text>
    <text x="308" y="535" class="m">—</text><text x="308" y="565">6m 03s</text><text x="308" y="595" class="m">—</text>
  </g>
  <g font-size="12" class="d" text-anchor="end">
    <text x="448" y="445">+214</text><text x="448" y="475">+187</text><text x="448" y="505">3 diffs</text>
    <text x="448" y="535" class="m">—</text><text x="448" y="565">14 pages</text><text x="448" y="595" class="m">—</text>
  </g>

  <!-- API -->
  <rect x="488" y="364" width="448" height="252" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="508" y="392" font-size="14" class="w b">REST API</text>
  <text x="916" y="392" font-size="11" class="m" text-anchor="end">auth: API key</text>
  <rect x="504" y="404" width="416" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="516" y="423" font-size="12" class="mono p"><tspan class="g b">GET</tspan> /v1/listings?category=dentist</text>
  <text x="908" y="423" font-size="11" class="mono g" text-anchor="end">200 · 38 ms</text>
  <g font-size="11" class="mono s">
    <text x="516" y="456">{</text>
    <text x="530" y="472">"data": [{</text>
    <text x="544" y="488">"id": <tspan class="w">"lst_8f2k1"</tspan>,</text>
    <text x="544" y="504">"name": <tspan class="w">"Bright Smile Dental"</tspan>,</text>
    <text x="544" y="520">"category": <tspan class="w">"Dentist"</tspan>,</text>
    <text x="544" y="536">"phone": <tspan class="w">"+1 555 201 8890"</tspan>,</text>
    <text x="544" y="552">"updated_at": <tspan class="w">"2026-09-13T06:02:11Z"</tspan></text>
    <text x="530" y="568">}],</text>
    <text x="530" y="584">"next_cursor": <tspan class="bl">"c_20"</tspan></text>
    <text x="516" y="600">}</text>
  </g>
</svg>
