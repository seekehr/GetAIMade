<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>ShiaBox: scraped hadith embedded into Qdrant, the top 10 matches reranked to 3 by Groq, and a chat answer citing each narration</title>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}.d{fill:#d4d4d8}
    .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    .ar{font-family:'Segoe UI', 'Noto Naskh Arabic', 'Geeza Pro', Tahoma, sans-serif}
    .v{fill:#a78bfa}.bl{fill:#60a5fa}.g{fill:#4ade80}.a{fill:#fbbf24}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">ShiaBox — AI search over scraped hadith</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Ollama embeddings · Qdrant · Groq</text>

  <!-- Index -->
  <rect x="24" y="64" width="420" height="156" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="86" font-size="12" class="w b">Index</text>
  <text x="424" y="86" font-size="10" class="m mono" text-anchor="end">uv run python setup.py</text>
  <path d="M24 98h420" stroke="#27272a"/>
  <g fill="#18181b" stroke="#27272a">
    <rect x="44" y="114" width="104" height="28" rx="14"/>
    <rect x="170" y="114" width="150" height="28" rx="14"/>
    <rect x="342" y="114" width="82" height="28" rx="14"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="96" y="132" class="a mono">al-kafi.json</text>
    <text x="245" y="132" class="v mono">qwen3-embedding:4b</text>
    <text x="383" y="132" class="p">Qdrant</text>
  </g>
  <g fill="none" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M152 128h12M160 124l4 4-4 4M324 128h12M332 124l4 4-4 4"/>
  </g>
  <g font-size="11" class="mono d">
    <text x="44" y="172"><tspan class="g">✓</tspan> scraped hadith records embedded</text>
    <text x="44" y="196"><tspan class="g">✓</tspan> on-disk index: server/assets/qdrant_data</text>
  </g>

  <circle cx="234" cy="228" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M229 226l5 5 5-5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Retrieve & rank -->
  <rect x="24" y="236" width="420" height="380" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="258" font-size="12" class="w b">Retrieve &amp; rerank</text>
  <text x="424" y="258" font-size="10" class="m mono" text-anchor="end">Qdrant top 10 → <tspan class="g">Groq keeps 3</tspan></text>
  <path d="M24 270h420" stroke="#27272a"/>
  <text x="44" y="292" font-size="10" class="m">Query, embedded with the same model</text>
  <rect x="44" y="302" width="380" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="58" y="321" font-size="12" class="d">What does Al-Kāfi say about the intellect?</text>

  <g fill="#4ade80" fill-opacity=".08" stroke="#22c55e" stroke-opacity=".6">
    <rect x="40" y="348" width="388" height="22" rx="5"/>
    <rect x="40" y="396" width="388" height="22" rx="5"/>
    <rect x="40" y="468" width="388" height="22" rx="5"/>
  </g>
  <g font-size="11" class="mono">
    <text x="50" y="363" class="g b">01</text><text x="76" y="363" class="p">Al-Kāfi 1 · Book 1 · Ch 1 · #1</text>
    <text x="50" y="387" class="m">02</text><text x="76" y="387" class="m">Al-Kāfi 1 · Book 1 · Ch 1 · #14</text>
    <text x="50" y="411" class="g b">03</text><text x="76" y="411" class="p">Al-Kāfi 1 · Book 1 · Ch 1 · #4</text>
    <text x="50" y="435" class="m">04</text><text x="76" y="435" class="m">Al-Kāfi 1 · Book 1 · Ch 2 · #3</text>
    <text x="50" y="459" class="m">05</text><text x="76" y="459" class="m">Al-Kāfi 1 · Book 1 · Ch 1 · #9</text>
    <text x="50" y="483" class="g b">06</text><text x="76" y="483" class="p">Al-Kāfi 1 · Book 1 · Ch 1 · #2</text>
    <text x="50" y="507" class="m">07</text><text x="76" y="507" class="m">Al-Kāfi 1 · Book 2 · Ch 1 · #6</text>
    <text x="50" y="531" class="m">08</text><text x="76" y="531" class="m">Al-Kāfi 1 · Book 1 · Ch 3 · #1</text>
    <text x="50" y="555" class="m">09</text><text x="76" y="555" class="m">Al-Kāfi 1 · Book 1 · Ch 1 · #20</text>
    <text x="50" y="579" class="m">10</text><text x="76" y="579" class="m">Al-Kāfi 2 · Book 1 · Ch 4 · #2</text>
  </g>
  <g fill="#27272a">
    <rect x="320" y="355" width="64" height="8" rx="4"/><rect x="320" y="379" width="64" height="8" rx="4"/>
    <rect x="320" y="403" width="64" height="8" rx="4"/><rect x="320" y="427" width="64" height="8" rx="4"/>
    <rect x="320" y="451" width="64" height="8" rx="4"/><rect x="320" y="475" width="64" height="8" rx="4"/>
    <rect x="320" y="499" width="64" height="8" rx="4"/><rect x="320" y="523" width="64" height="8" rx="4"/>
    <rect x="320" y="547" width="64" height="8" rx="4"/><rect x="320" y="571" width="64" height="8" rx="4"/>
  </g>
  <g>
    <rect x="320" y="355" width="58" height="8" rx="4" fill="#4ade80"/>
    <rect x="320" y="379" width="55" height="8" rx="4" fill="#52525b"/>
    <rect x="320" y="403" width="54" height="8" rx="4" fill="#4ade80"/>
    <rect x="320" y="427" width="52" height="8" rx="4" fill="#52525b"/>
    <rect x="320" y="451" width="51" height="8" rx="4" fill="#52525b"/>
    <rect x="320" y="475" width="50" height="8" rx="4" fill="#4ade80"/>
    <rect x="320" y="499" width="48" height="8" rx="4" fill="#52525b"/>
    <rect x="320" y="523" width="47" height="8" rx="4" fill="#52525b"/>
    <rect x="320" y="547" width="46" height="8" rx="4" fill="#52525b"/>
    <rect x="320" y="571" width="45" height="8" rx="4" fill="#52525b"/>
  </g>
  <g font-size="10" class="mono m" text-anchor="end">
    <text x="420" y="363" class="g">.83</text><text x="420" y="387">.79</text><text x="420" y="411" class="g">.78</text>
    <text x="420" y="435">.76</text><text x="420" y="459">.75</text><text x="420" y="483" class="g">.74</text>
    <text x="420" y="507">.72</text><text x="420" y="531">.71</text><text x="420" y="555">.70</text><text x="420" y="579">.69</text>
  </g>
  <text x="44" y="604" font-size="10" class="m">Similarity finds candidates, the LLM picks the ones that actually answer</text>

  <circle cx="456" cy="340" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 335l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chat -->
  <rect x="468" y="64" width="468" height="552" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="90" font-size="15" class="w b">ShiaBox</text>
  <text x="916" y="90" font-size="11" class="m mono" text-anchor="end">FastAPI · streaming</text>
  <path d="M468 104h468" stroke="#27272a"/>

  <rect x="628" y="120" width="288" height="34" rx="17" fill="#27272a"/>
  <text x="902" y="142" font-size="12" class="p" text-anchor="end">What does Al-Kāfi say about the intellect?</text>

  <circle cx="494" cy="178" r="5" fill="#4ade80"/>
  <text x="506" y="182" font-size="11" class="s b">ShiaBox</text>
  <g font-size="13" class="d">
    <text x="488" y="208">Al-Kāfi opens with the Book of Intellect and Ignorance.</text>
    <text x="488" y="228">Its first hadith describes Allah creating the intellect</text>
    <text x="488" y="248">and making it speak <tspan class="bl b">[1]</tspan>. Other narrations in the same</text>
    <text x="488" y="268">chapter develop the same theme <tspan class="bl b">[2]</tspan> <tspan class="bl b">[3]</tspan>.</text>
  </g>

  <!-- Source [1] -->
  <rect x="488" y="290" width="428" height="160" rx="10" fill="#18181b" stroke="#3b82f6" stroke-opacity=".6"/>
  <text x="502" y="313" font-size="11" class="bl b mono">[1]</text>
  <text x="530" y="313" font-size="11" class="p mono">Al-Kāfi 1 · Book 1 · Ch 1 · #1</text>
  <text x="902" y="313" font-size="10" class="a" text-anchor="end">thaqalayn.net ↗</text>
  <text x="902" y="346" font-size="17" class="ar g" direction="rtl" text-anchor="start">لَمَّا خَلَقَ اللَّهُ الْعَقْلَ اسْتَنْطَقَهُ</text>
  <text x="502" y="374" font-size="12" class="d">When Allah created the intellect, He made it speak…</text>
  <path d="M502 390h400" stroke="#27272a"/>
  <text x="502" y="410" font-size="10" class="m">WHY IT WAS PICKED</text>
  <text x="502" y="432" font-size="12" class="s">Directly describes the creation of the intellect.</text>

  <!-- Sources [2] [3] -->
  <rect x="488" y="462" width="428" height="40" rx="10" fill="#18181b" stroke="#27272a"/>
  <text x="502" y="487" font-size="11" class="bl b mono">[2]</text>
  <text x="530" y="487" font-size="11" class="p mono">Al-Kāfi 1 · Book 1 · Ch 1 · #4</text>
  <text x="902" y="487" font-size="10" class="a" text-anchor="end">thaqalayn.net ↗</text>
  <rect x="488" y="512" width="428" height="40" rx="10" fill="#18181b" stroke="#27272a"/>
  <text x="502" y="537" font-size="11" class="bl b mono">[3]</text>
  <text x="530" y="537" font-size="11" class="p mono">Al-Kāfi 1 · Book 1 · Ch 1 · #2</text>
  <text x="902" y="537" font-size="10" class="a" text-anchor="end">thaqalayn.net ↗</text>

  <!-- Input -->
  <rect x="488" y="566" width="428" height="36" rx="18" fill="#0b0b0c" stroke="#27272a"/>
  <text x="508" y="589" font-size="12" class="m">Ask about a hadith…</text>
  <circle cx="898" cy="584" r="12" fill="#fafafa"/>
  <path d="M893 584h9M898 579l5 5-5 5" fill="none" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
