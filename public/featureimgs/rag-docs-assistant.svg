<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Docs assistant built on a crawled documentation site: a chat answer with numbered citations linking to the source pages</title>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}
    .cap{font-size:11px;letter-spacing:.08em;font-weight:700;fill:#71717a}
    .c{fill:#60a5fa}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">Docs Assistant — built on crawled docs</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">1,368 pages indexed · re-crawled daily</text>

  <!-- Sidebar -->
  <rect x="24" y="64" width="240" height="552" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="92" class="cap">CRAWLED SOURCES</text>

  <rect x="40" y="114" width="28" height="28" rx="7" fill="#27272a"/><text x="54" y="133" font-size="12" class="p b" text-anchor="middle">D</text>
  <text x="80" y="127" font-size="13" class="w b">docs.acme.dev</text>
  <text x="80" y="143" font-size="11" class="m">842 pages</text>
  <circle cx="244" cy="128" r="4" fill="#4ade80"/>

  <rect x="40" y="166" width="28" height="28" rx="7" fill="#27272a"/><text x="54" y="185" font-size="11" class="p b" text-anchor="middle">{ }</text>
  <text x="80" y="179" font-size="13" class="w b">API reference</text>
  <text x="80" y="195" font-size="11" class="m">310 endpoints</text>
  <circle cx="244" cy="180" r="4" fill="#4ade80"/>

  <rect x="40" y="218" width="28" height="28" rx="7" fill="#27272a"/><text x="54" y="237" font-size="12" class="p b" text-anchor="middle">C</text>
  <text x="80" y="231" font-size="13" class="w b">Changelog</text>
  <text x="80" y="247" font-size="11" class="m">96 entries</text>
  <circle cx="244" cy="232" r="4" fill="#4ade80"/>

  <rect x="40" y="270" width="28" height="28" rx="7" fill="#27272a"/><text x="54" y="289" font-size="12" class="p b" text-anchor="middle">F</text>
  <text x="80" y="283" font-size="13" class="w b">Community forum</text>
  <text x="80" y="299" font-size="11" class="m">120 solved threads</text>
  <circle cx="244" cy="284" r="4" fill="#4ade80"/>

  <path d="M40 324h208" stroke="#27272a"/>
  <text x="44" y="352" class="cap">RECENT</text>
  <rect x="36" y="364" width="216" height="30" rx="6" fill="#1c1c1f"/>
  <text x="48" y="384" font-size="12" class="p">Rotate an API key safely</text>
  <text x="48" y="414" font-size="12" class="s">Webhook retry schedule</text>
  <text x="48" y="444" font-size="12" class="s">Rate limits on the free plan</text>
  <text x="48" y="474" font-size="12" class="s">Migrating from v1 to v2</text>
  <path d="M40 566h208" stroke="#27272a"/>
  <text x="44" y="590" font-size="11" class="m">Last crawl 03:00 · 14 pages changed</text>

  <!-- Chat -->
  <rect x="288" y="64" width="648" height="552" rx="12" fill="#111113" stroke="#27272a"/>

  <rect x="528" y="88" width="388" height="66" rx="14" fill="#27272a"/>
  <text x="546" y="115" font-size="14" class="w">How do I rotate an API key without</text>
  <text x="546" y="139" font-size="14" class="w">breaking production?</text>

  <rect x="308" y="178" width="32" height="32" rx="8" fill="#fafafa"/>
  <text x="324" y="199" font-size="12" class="b" fill="#0b0b0c" text-anchor="middle">AI</text>
  <text x="356" y="198" font-size="14" class="p">Create a second key, deploy it, then revoke the old one <tspan class="c b">[1]</tspan>.</text>
  <text x="356" y="222" font-size="14" class="p">Both keys work in parallel until you revoke, but revoking is</text>
  <text x="356" y="246" font-size="14" class="p">immediate, so switch all traffic first <tspan class="c b">[1][2]</tspan>.</text>
  <text x="356" y="278" font-size="14" class="p">Since v2.3 you can also scope keys per environment <tspan class="c b">[3]</tspan>.</text>

  <text x="356" y="314" class="cap">SOURCES</text>
  <rect x="356" y="326" width="178" height="108" rx="10" fill="#141416" stroke="#27272a"/>
  <circle cx="376" cy="348" r="9" fill="#111d2e" stroke="#1e3a5f"/>
  <text x="376" y="352" font-size="10" class="b c" text-anchor="middle">1</text>
  <text x="392" y="352" font-size="12" class="w b">API keys</text>
  <text x="370" y="372" font-size="10" class="c">docs.acme.dev/auth/api-keys</text>
  <text x="370" y="396" font-size="11" class="s" font-style="italic">“Revoking a key takes</text>
  <text x="370" y="412" font-size="11" class="s" font-style="italic">effect immediately.”</text>

  <rect x="546" y="326" width="178" height="108" rx="10" fill="#141416" stroke="#27272a"/>
  <circle cx="566" cy="348" r="9" fill="#111d2e" stroke="#1e3a5f"/>
  <text x="566" y="352" font-size="10" class="b c" text-anchor="middle">2</text>
  <text x="582" y="352" font-size="12" class="w b">Deploy guide</text>
  <text x="560" y="372" font-size="10" class="c">docs.acme.dev/guides/deploys</text>
  <text x="560" y="396" font-size="11" class="s" font-style="italic">“Roll out new secrets</text>
  <text x="560" y="412" font-size="11" class="s" font-style="italic">before removing old ones.”</text>

  <rect x="736" y="326" width="178" height="108" rx="10" fill="#141416" stroke="#27272a"/>
  <circle cx="756" cy="348" r="9" fill="#111d2e" stroke="#1e3a5f"/>
  <text x="756" y="352" font-size="10" class="b c" text-anchor="middle">3</text>
  <text x="772" y="352" font-size="12" class="w b">Changelog v2.3</text>
  <text x="750" y="372" font-size="10" class="c">acme.dev/changelog#v2-3</text>
  <text x="750" y="396" font-size="11" class="s" font-style="italic">“Keys can now be scoped</text>
  <text x="750" y="412" font-size="11" class="s" font-style="italic">to an environment.”</text>

  <text x="356" y="462" font-size="12" class="m">Copy   ·   Regenerate   ·   Answered from 3 of 1,368 pages</text>

  <rect x="356" y="486" width="186" height="30" rx="15" fill="none" stroke="#3f3f46"/>
  <text x="449" y="505" font-size="12" class="p" text-anchor="middle">Show the API keys page</text>
  <rect x="552" y="486" width="180" height="30" rx="15" fill="none" stroke="#3f3f46"/>
  <text x="642" y="505" font-size="12" class="p" text-anchor="middle">Open a support ticket</text>

  <rect x="308" y="548" width="608" height="48" rx="24" fill="#141416" stroke="#3f3f46"/>
  <text x="332" y="577" font-size="14" class="m">Ask anything about Acme’s docs…</text>
  <circle cx="892" cy="572" r="16" fill="#fafafa"/>
  <path d="M892 580v-16M885 571l7-7 7 7" fill="none" stroke="#0b0b0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
