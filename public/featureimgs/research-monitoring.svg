<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Polymarket bot: a live tick stream crossing a configured threshold, the YAML strategy and risk config, the latency breakdown from tick to signed order, and guard metrics with auto-halt limits</title>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}.d{fill:#d4d4d8}
    .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    .v{fill:#a78bfa}.bl{fill:#60a5fa}.g{fill:#4ade80}.a{fill:#fbbf24}.r{fill:#f87171}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">Polymarket bot — live feed → rule → order</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Go · WebSocket · Prometheus</text>

  <!-- Live market feed -->
  <rect x="24" y="64" width="420" height="300" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="86" font-size="12" class="w b">Live market feed</text>
  <text x="424" y="86" font-size="10" class="m mono" text-anchor="end">wss · clob.polymarket.com</text>
  <path d="M24 98h420" stroke="#27272a"/>

  <rect x="44" y="110" width="380" height="46" rx="8" fill="#18181b" stroke="#27272a"/>
  <circle cx="58" cy="128" r="3.5" fill="#4ade80"/>
  <text x="70" y="132" font-size="12" class="w b">Fed cuts rates in March</text>
  <text x="410" y="132" font-size="10" class="m" text-anchor="end">$142k liquidity</text>
  <text x="70" y="148" font-size="10" class="s mono">1765369264423 · book + trades</text>

  <rect x="44" y="164" width="380" height="46" rx="8" fill="#18181b" stroke="#27272a"/>
  <circle cx="58" cy="182" r="3.5" fill="#4ade80"/>
  <text x="70" y="186" font-size="12" class="w b">Champions League winner</text>
  <text x="410" y="186" font-size="10" class="m" text-anchor="end">$88k liquidity</text>
  <text x="70" y="202" font-size="10" class="s mono">1765370118902 · book + trades</text>

  <text x="44" y="234" font-size="10" class="m mono">tick stream · 1,240 msgs/min · buffered 1,000</text>
  <path d="M44 242h380" stroke="#27272a"/>
  <g font-size="11" class="mono">
    <text x="52" y="266" class="s">14:02:11.204</text><text x="180" y="266" class="d">0.512</text><text x="240" y="266" class="g">▲ +0.004</text>
    <text x="52" y="288" class="s">14:02:11.661</text><text x="180" y="288" class="d">0.488</text><text x="240" y="288" class="r">▼ −0.024</text>
    <text x="52" y="310" class="s">14:02:12.019</text><text x="180" y="310" class="d">0.463</text><text x="240" y="310" class="r">▼ −0.025</text>
  </g>
  <rect x="44" y="318" width="380" height="28" rx="6" fill="#12251a" stroke="#22c55e" stroke-opacity=".6"/>
  <g font-size="11" class="mono">
    <text x="52" y="337" class="p">14:02:12.377</text><text x="180" y="337" class="w b">0.442</text><text x="240" y="337" class="g">▼ below buy_below</text>
  </g>

  <circle cx="456" cy="214" r="11" fill="#0b0b0c" stroke="#52525b"/>
  <path d="M453 209l5 5-5 5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- config.yml -->
  <rect x="24" y="376" width="420" height="240" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="398" font-size="12" class="w b">config.yml</text>
  <text x="424" y="398" font-size="10" class="m mono" text-anchor="end">no code changes</text>
  <path d="M24 410h420" stroke="#27272a"/>
  <g font-size="11" class="mono">
    <text x="44" y="434" class="w b">strategy:</text>
    <text x="58" y="454" class="s">mode: <tspan class="v">threshold</tspan></text>
    <text x="58" y="474" class="s">buy_below: <tspan class="g">0.45</tspan></text>
    <text x="58" y="494" class="s">sell_above: <tspan class="g">0.55</tspan></text>
    <text x="58" y="514" class="s">quantity: <tspan class="bl">100</tspan></text>
    <text x="44" y="538" class="w b">risk:</text>
    <text x="58" y="558" class="s">max_daily_loss: <tspan class="a">1000</tspan></text>
    <text x="58" y="578" class="s">auto_halt_on_loss: <tspan class="a">true</tspan></text>
  </g>
  <text x="44" y="602" font-size="10" class="m">Thresholds, risk caps and latency budgets live here, not in code.</text>

  <!-- Tick to order -->
  <rect x="468" y="64" width="468" height="300" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="90" font-size="15" class="w b">Tick → order</text>
  <text x="916" y="90" font-size="11" class="m mono" text-anchor="end">worker pool of 4</text>
  <path d="M468 104h468" stroke="#27272a"/>
  <g font-size="11" class="p">
    <text x="488" y="136">decode tick</text>
    <text x="488" y="162">evaluate strategy</text>
    <text x="488" y="188">sign order (HMAC)</text>
    <text x="488" y="214">POST /order</text>
  </g>
  <g>
    <rect x="628" y="127" width="5" height="10" rx="2.5" fill="#60a5fa"/>
    <rect x="628" y="153" width="4" height="10" rx="2" fill="#60a5fa"/>
    <rect x="628" y="179" width="10" height="10" rx="3" fill="#60a5fa"/>
    <rect x="628" y="205" width="228" height="10" rx="4" fill="#fbbf24"/>
  </g>
  <g font-size="11" class="mono" text-anchor="end">
    <text x="916" y="136" class="s">0.08 ms</text>
    <text x="916" y="162" class="s">0.03 ms</text>
    <text x="916" y="188" class="s">0.21 ms</text>
    <text x="916" y="214" class="a">6.40 ms</text>
  </g>
  <path d="M488 232h428" stroke="#27272a"/>
  <text x="488" y="254" font-size="12" class="w b">total 6.72 ms</text>
  <text x="916" y="254" font-size="11" class="m mono" text-anchor="end">halt budget 100 ms</text>

  <rect x="488" y="268" width="428" height="78" rx="10" fill="#18181b" stroke="#22c55e" stroke-opacity=".5"/>
  <rect x="502" y="280" width="58" height="18" rx="9" fill="#4ade80" fill-opacity=".12"/>
  <text x="531" y="293" font-size="10" class="g b" text-anchor="middle">FILLED</text>
  <text x="902" y="293" font-size="10" class="m mono" text-anchor="end">GTC · 0 retries</text>
  <text x="502" y="320" font-size="13" class="w b">BUY 100 @ 0.442</text>
  <text x="502" y="338" font-size="11" class="s">slippage ≤ 0.5% · within max_position_size 500</text>

  <!-- Guards & metrics -->
  <rect x="468" y="376" width="468" height="240" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="488" y="398" font-size="12" class="w b">Guards &amp; metrics</text>
  <text x="916" y="398" font-size="10" class="m mono" text-anchor="end">:9090/metrics</text>
  <path d="M468 410h468" stroke="#27272a"/>

  <rect x="488" y="422" width="206" height="64" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="502" y="442" font-size="10" class="m">p99 latency</text>
  <text x="502" y="466" font-size="16" class="g b">8.1 ms</text>
  <text x="680" y="466" font-size="10" class="m" text-anchor="end">halt &gt; 100 ms</text>

  <rect x="710" y="422" width="206" height="64" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="724" y="442" font-size="10" class="m">order rate</text>
  <text x="724" y="466" font-size="16" class="w b">3 / s</text>
  <text x="902" y="466" font-size="10" class="m" text-anchor="end">cap 5 / s</text>

  <rect x="488" y="496" width="206" height="64" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="502" y="516" font-size="10" class="m">daily P&amp;L</text>
  <text x="502" y="540" font-size="16" class="a b">−$180</text>
  <text x="680" y="540" font-size="10" class="m" text-anchor="end">halt at −$1,000</text>

  <rect x="710" y="496" width="206" height="64" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="724" y="516" font-size="10" class="m">exposure</text>
  <text x="724" y="540" font-size="16" class="w b">$2.4k</text>
  <text x="902" y="540" font-size="10" class="m" text-anchor="end">cap $5k / market</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="496" cy="586" r="7" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M493 586l2 2 4-4" stroke="#4ade80" stroke-width="1.5"/>
  </g>
  <text x="512" y="590" font-size="12" class="p">Drops reconnect, replay the book and recover open positions</text>
</svg>
