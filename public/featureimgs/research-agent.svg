  <text x="44" y="606" font-size="12" class="m">+ 18 more sources</text>

  <!-- Report -->
  <rect x="408" y="64" width="528" height="552" rx="12" fill="#111113" stroke="#27272a"/>
  <rect x="432" y="84" width="64" height="22" rx="11" fill="#111d2e" stroke="#1e3a5f"/>
  <text x="464" y="99" font-size="10" class="b" fill="#60a5fa" text-anchor="middle" letter-spacing="1">REPORT</text>
  <text x="508" y="99" font-size="12" class="m">Generated 13 Sep 2026 · 17 citations</text>
  <text x="432" y="140" font-size="21" class="w b">Competitor Brief: AI Note-Taking Apps</text>
  <path d="M432 160h480" stroke="#27272a"/>

  <text x="432" y="188" font-size="14" class="w b">Summary</text>
  <text x="432" y="212" font-size="13" class="d">All three now include transcription for free — the competition has</text>
  <text x="432" y="232" font-size="13" class="d">moved to team features. Scribe.ai shipped shared workspaces in</text>
  <text x="432" y="252" font-size="13" class="d">August <tspan class="c">[2]</tspan>, and MeetMind cut its Pro tier to $12/mo <tspan class="c">[5]</tspan>. Notely</text>
  <text x="432" y="272" font-size="13" class="d">remains focused on individual users <tspan class="c">[1][4]</tspan>.</text>

  <text x="432" y="308" font-size="14" class="w b">Comparison</text>
  <rect x="432" y="322" width="480" height="26" fill="#18181b"/>
  <path d="M432 348h480M432 382h480M432 416h480M536 322v128M624 322v128M760 322v128" stroke="#27272a"/>
  <rect x="432" y="322" width="480" height="128" fill="none" stroke="#27272a"/>
  <g font-size="11" class="s b">
    <text x="444" y="339">App</text><text x="548" y="339">Price</text><text x="636" y="339">Positioning</text><text x="772" y="339">Recent move</text>
  </g>
  <g font-size="12" class="d">
    <text x="444" y="369" class="w b">Notely</text><text x="548" y="369">$10/mo</text><text x="636" y="369">Solo creators</text><text x="772" y="369">Offline mode <tspan class="c">[1]</tspan></text>
    <text x="444" y="403" class="w b">Scribe.ai</text><text x="548" y="403">$15/seat</text><text x="636" y="403">Teams</text><text x="772" y="403">Workspaces <tspan class="c">[2]</tspan></text>
    <text x="444" y="437" class="w b">MeetMind</text><text x="548" y="437">$12/mo</text><text x="636" y="437">Sales calls</text><text x="772" y="437">Price cut <tspan class="c">[5]</tspan></text>
  </g>

  <text x="432" y="486" font-size="14" class="w b">Opportunities</text>
  <text x="432" y="512" font-size="13" class="d">• Nobody owns the meeting → CRM workflow yet <tspan class="c">[3][4]</tspan></text>
  <text x="432" y="536" font-size="13" class="d">• Team pricing is still per-seat across the board <tspan class="c">[1][2]</tspan></text>
  <text x="432" y="560" font-size="13" class="d">• Offline and privacy are an underused angle <tspan class="c">[1]</tspan></text>

  <path d="M432 578h480" stroke="#27272a"/>
  <text x="432" y="603" font-size="12" class="m">Export</text>
  <rect x="484" y="588" width="44" height="22" rx="6" fill="none" stroke="#3f3f46"/><text x="506" y="603" font-size="11" class="p" text-anchor="middle">PDF</text>
  <rect x="536" y="588" width="62" height="22" rx="6" fill="none" stroke="#3f3f46"/><text x="567" y="603" font-size="11" class="p" text-anchor="middle">Notion</text>
  <rect x="606" y="588" width="88" height="22" rx="6" fill="none" stroke="#3f3f46"/><text x="650" y="603" font-size="11" class="p" text-anchor="middle">Google Doc</text>
