  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">Research Agent — Competitor Brief</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Completed in 6m 12s · 23 sources</text>

  <!-- Agent run -->
  <rect x="24" y="64" width="360" height="552" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="92" class="cap">TASK</text>
  <rect x="40" y="102" width="328" height="64" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="54" y="128" font-size="13" class="p">Compare the top 3 AI note-taking apps:</text>
  <text x="54" y="150" font-size="13" class="p">pricing, positioning, recent launches.</text>

  <text x="44" y="196" class="cap">STEPS</text>
  <g fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="52" cy="218" r="8" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M48 218l3 3 5-6"/>
    <circle cx="52" cy="244" r="8" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M48 244l3 3 5-6"/>
    <circle cx="52" cy="270" r="8" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M48 270l3 3 5-6"/>
    <circle cx="52" cy="296" r="8" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M48 296l3 3 5-6"/>
    <circle cx="52" cy="322" r="8" fill="#12251a" stroke="#22c55e" stroke-width="1"/><path d="M48 322l3 3 5-6"/>
  </g>
  <text x="70" y="222" font-size="13" class="p">Planned 6 search queries</text>
  <text x="70" y="248" font-size="13" class="p">Collected 23 sources</text>
  <text x="70" y="274" font-size="13" class="p">Read and summarized 17 pages</text>
  <text x="70" y="300" font-size="13" class="p">Cross-checked pricing pages</text>
  <text x="70" y="326" font-size="13" class="p">Wrote report · 1,240 words</text>
  <g font-size="11" class="m mono" text-anchor="end">
    <text x="368" y="222">0:04</text><text x="368" y="248">1:52</text><text x="368" y="274">4:31</text><text x="368" y="300">5:20</text><text x="368" y="326">6:12</text>
  </g>

  <text x="44" y="358" class="cap">SOURCES · 23</text>
  <g>
    <rect x="40" y="378" width="26" height="26" rx="6" fill="#27272a"/><text x="53" y="396" font-size="12" class="p b" text-anchor="middle">N</text>
    <text x="78" y="390" font-size="13" class="p">Notely pricing — plans &amp; FAQ</text>
    <text x="78" y="406" font-size="11" class="m">notely.app/pricing</text>
    <text x="368" y="390" font-size="11" class="mono c" text-anchor="end">[1]</text>

    <rect x="40" y="422" width="26" height="26" rx="6" fill="#27272a"/><text x="53" y="440" font-size="12" class="p b" text-anchor="middle">S</text>
    <text x="78" y="434" font-size="13" class="p">Scribe.ai launches team workspaces</text>
    <text x="78" y="450" font-size="11" class="m">scribe.ai/blog</text>
    <text x="368" y="434" font-size="11" class="mono c" text-anchor="end">[2]</text>

