    <text x="78" y="494" font-size="11" class="m">techreview.io</text>
    <text x="368" y="478" font-size="11" class="mono c" text-anchor="end">[3]</text>

    <rect x="40" y="510" width="26" height="26" rx="6" fill="#27272a"/><text x="53" y="528" font-size="12" class="p b" text-anchor="middle">P</text>
    <text x="78" y="522" font-size="13" class="p">AI note-takers compared (2026)</text>
    <text x="78" y="538" font-size="11" class="m">productlist.co</text>
    <text x="368" y="522" font-size="11" class="mono c" text-anchor="end">[4]</text>

    <rect x="40" y="554" width="26" height="26" rx="6" fill="#27272a"/><text x="53" y="572" font-size="12" class="p b" text-anchor="middle">M</text>
    <text x="78" y="566" font-size="13" class="p">MeetMind changelog — August</text>
    <text x="78" y="582" font-size="11" class="m">meetmind.com/changelog</text>
    <text x="368" y="566" font-size="11" class="mono c" text-anchor="end">[5]</text>
