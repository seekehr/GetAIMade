  <text x="652" y="100" font-size="14" class="w b">inbox-digest</text>
  <text x="916" y="100" font-size="12" class="m" text-anchor="end">Slack</text>
  <path d="M600 120h336" stroke="#27272a"/>
  <rect x="620" y="136" width="32" height="32" rx="8" fill="#fafafa"/>
  <text x="636" y="157" font-size="15" class="b" fill="#0b0b0c" text-anchor="middle">T</text>
  <text x="664" y="148" font-size="14" class="w b">Triage Bot</text>
  <rect x="752" y="137" width="30" height="15" rx="3" fill="#27272a"/>
  <text x="767" y="148" font-size="9" class="s b" text-anchor="middle">APP</text>
  <text x="790" y="148" font-size="12" class="m">9:02 AM</text>
  <text x="664" y="172" font-size="13" class="p">3 emails need you today:</text>
  <text x="664" y="196" font-size="13" class="p">• Acme renewal — reply by Fri</text>
  <text x="664" y="218" font-size="13" class="p">• Marco: rate-limit request</text>
  <text x="664" y="240" font-size="13" class="p">• Podcast invite — draft ready</text>
  <text x="664" y="266" font-size="12" class="m">11 others archived or filed.</text>
  <rect x="664" y="282" width="104" height="28" rx="6" fill="none" stroke="#3f3f46"/>
  <text x="716" y="300" font-size="12" class="p" text-anchor="middle">Open drafts</text>
  <rect x="776" y="282" width="84" height="28" rx="6" fill="none" stroke="#3f3f46"/>
  <text x="818" y="300" font-size="12" class="p" text-anchor="middle">View all</text>

  <!-- Notion tasks -->
  <rect x="600" y="348" width="336" height="268" rx="12" fill="#111113" stroke="#27272a"/>
  <rect x="620" y="368" width="22" height="22" rx="6" fill="#fafafa"/>
  <text x="631" y="384" font-size="13" class="b" fill="#0b0b0c" text-anchor="middle">N</text>
  <text x="652" y="384" font-size="14" class="w b">Tasks</text>
  <text x="916" y="384" font-size="12" class="m" text-anchor="end">Notion</text>
