<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Inbox triage system: emails classified, summarized and routed to Slack and Notion</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker>
  </defs>
  <style>
    .b{font-weight:700}
    .w{fill:#fafafa}.p{fill:#e4e4e7}.s{fill:#a1a1aa}.m{fill:#71717a}
    .cap{font-size:11px;letter-spacing:.06em;font-weight:700}
  </style>

  <rect width="960" height="640" rx="16" fill="#0b0b0c"/>
  <rect x=".5" y=".5" width="959" height="639" rx="15.5" fill="none" stroke="#27272a"/>
  <path d="M1 44h958" stroke="#27272a"/>
  <circle cx="24" cy="22" r="6" fill="#3f3f46"/><circle cx="44" cy="22" r="6" fill="#3f3f46"/><circle cx="64" cy="22" r="6" fill="#3f3f46"/>
  <text x="88" y="27" font-size="13" class="s">Inbox Triage — Gmail → Slack + Notion</text>
  <text x="936" y="27" font-size="12" class="m" text-anchor="end">Last run 09:02 · 14 emails</text>

  <!-- Inbox -->
  <rect x="24" y="64" width="520" height="552" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="44" y="96" font-size="17" class="w b">Inbox</text>
  <text x="96" y="96" font-size="13" class="m">14 new · 14 classified</text>
  <rect x="424" y="80" width="100" height="24" rx="12" fill="#12251a" stroke="#1f5132"/>
  <text x="474" y="96" font-size="12" fill="#4ade80" text-anchor="middle">Auto-triaged</text>
  <path d="M24 112h520" stroke="#27272a"/>

  <text x="44" y="144" font-size="15" class="w b">Sarah Chen · Acme Corp</text>
  <rect x="458" y="129" width="66" height="22" rx="11" fill="#2a1515" stroke="#5b2323"/>
  <text x="491" y="144" class="cap" fill="#f87171" text-anchor="middle">URGENT</text>
  <text x="44" y="167" font-size="14" class="p">Contract renewal — need an answer by Friday</text>
  <rect x="44" y="178" width="22" height="16" rx="4" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="55" y="190" font-size="9" class="s b" text-anchor="middle">AI</text>
  <text x="74" y="191" font-size="13" class="s">Wants a 12-month renewal at the current rate. Deadline Fri.</text>
  <path d="M24 212h520" stroke="#1f1f23"/>

  <text x="44" y="244" font-size="15" class="w b">Stripe</text>
  <rect x="450" y="229" width="74" height="22" rx="11" fill="#2a2210" stroke="#5c4a17"/>
  <text x="487" y="244" class="cap" fill="#fbbf24" text-anchor="middle">INVOICE</text>
  <text x="44" y="267" font-size="14" class="p">Your invoice INV-2291 is available</text>
  <rect x="44" y="278" width="22" height="16" rx="4" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="55" y="290" font-size="9" class="s b" text-anchor="middle">AI</text>
  <text x="74" y="291" font-size="13" class="s">$1,240.00 due Oct 1 — logged to the Finance sheet.</text>
  <path d="M24 312h520" stroke="#1f1f23"/>

  <text x="44" y="344" font-size="15" class="w b">Marco Ruiz · Fleetgrid</text>
  <rect x="458" y="329" width="66" height="22" rx="11" fill="#111d2e" stroke="#1e3a5f"/>
  <text x="491" y="344" class="cap" fill="#60a5fa" text-anchor="middle">CLIENT</text>
  <text x="44" y="367" font-size="14" class="p">Quick question about API rate limits</text>
  <rect x="44" y="378" width="22" height="16" rx="4" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="55" y="390" font-size="9" class="s b" text-anchor="middle">AI</text>
  <text x="74" y="391" font-size="13" class="s">Asks to raise the limit to 500 req/min before launch.</text>
  <path d="M24 412h520" stroke="#1f1f23"/>

