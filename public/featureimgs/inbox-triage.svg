  <text x="620" y="428" class="cap m" font-size="10">TASK</text>
  <text x="800" y="428" class="cap m" font-size="10">DUE</text>
  <text x="852" y="428" class="cap m" font-size="10">STATUS</text>
  <path d="M600 438h336" stroke="#1f1f23"/>

  <rect x="620" y="451" width="14" height="14" rx="3" fill="none" stroke="#52525b"/>
  <text x="644" y="463" font-size="13" class="p">Reply: Acme renewal</text>
  <text x="800" y="463" font-size="12" class="s">Fri</text>
  <rect x="852" y="447" width="64" height="22" rx="11" fill="#1c1c1f" stroke="#3f3f46"/>
  <text x="884" y="462" font-size="11" class="b" fill="#a1a1aa" text-anchor="middle">To do</text>
  <path d="M600 480h336" stroke="#1f1f23"/>

  <rect x="620" y="495" width="14" height="14" rx="3" fill="none" stroke="#52525b"/>
  <text x="644" y="507" font-size="13" class="p">Review podcast reply</text>
  <text x="800" y="507" font-size="12" class="s">Today</text>
  <rect x="852" y="491" width="64" height="22" rx="11" fill="#2a2210" stroke="#5c4a17"/>
  <text x="884" y="506" font-size="11" class="b" fill="#fbbf24" text-anchor="middle">Draft</text>
  <path d="M600 524h336" stroke="#1f1f23"/>

  <rect x="620" y="539" width="14" height="14" rx="3" fill="none" stroke="#52525b"/>
  <text x="644" y="551" font-size="13" class="p">Answer Marco (API)</text>
  <text x="800" y="551" font-size="12" class="s">Mon</text>
  <rect x="852" y="535" width="64" height="22" rx="11" fill="#1c1c1f" stroke="#3f3f46"/>
  <text x="884" y="550" font-size="11" class="b" fill="#a1a1aa" text-anchor="middle">To do</text>
  <path d="M600 568h336" stroke="#1f1f23"/>

  <rect x="620" y="583" width="14" height="14" rx="3" fill="#22c55e" stroke="#22c55e"/>
  <path d="M623 590l3 3 6-6" fill="none" stroke="#0b0b0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="644" y="595" font-size="13" class="s">Log Stripe INV-2291</text>
  <text x="800" y="595" font-size="12" class="s">Oct 1</text>
  <rect x="852" y="579" width="64" height="22" rx="11" fill="#12251a" stroke="#1f5132"/>
