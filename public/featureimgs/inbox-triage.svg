  <rect x="44" y="478" width="22" height="16" rx="4" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="55" y="490" font-size="9" class="s b" text-anchor="middle">AI</text>
  <text x="74" y="491" font-size="13" class="s">Newsletter — archived and added to Friday reading list.</text>
  <path d="M24 512h520" stroke="#1f1f23"/>

  <text x="44" y="544" font-size="15" class="w b">Priya Nair · The Build Pod</text>
  <rect x="420" y="529" width="104" height="22" rx="11" fill="#12251a" stroke="#1f5132"/>
  <text x="472" y="544" class="cap" fill="#4ade80" text-anchor="middle">OPPORTUNITY</text>
  <text x="44" y="567" font-size="14" class="p">Would you join us as a podcast guest?</text>
  <rect x="44" y="578" width="22" height="16" rx="4" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="55" y="590" font-size="9" class="s b" text-anchor="middle">AI</text>
  <text x="74" y="591" font-size="13" class="s">Guest slot on Oct 14. Reply drafted — waiting for review.</text>

  <!-- Routing -->
  <path d="M548 340C574 340 572 198 594 198" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <path d="M548 340C574 340 572 482 594 482" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- Slack digest -->
  <rect x="600" y="64" width="336" height="268" rx="12" fill="#111113" stroke="#27272a"/>
  <rect x="620" y="84" width="22" height="22" rx="6" fill="#27272a"/>
